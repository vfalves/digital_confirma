<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Biométrico</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; }
        #message { text-align: center; margin-top: 20px; font-weight: bold; }
        h2 { text-align: center; }
        #userListContainer { margin-top: 20px; }
        #userListContainer ul { list-style-type: none; padding: 0; }
        #userListContainer li { background-color: #f0f0f0; border: 1px solid #ddd; padding: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuário com Biometria</h2>
        <form id="registrationForm">
            <input type="text" id="name" placeholder="Nome Completo" required>
            <input type="text" id="role" placeholder="Função" required>
            <input type="text" id="company" placeholder="Empresa" required>
            <button type="submit">Cadastrar e Vincular Digital</button>
        </form>

        <hr>

        <h2>Confirmação de Acesso com Biometria</h2>
        <form id="loginForm">
            <button type="submit">Confirmar Digital</button>
        </form>
        
        <hr>

        <button id="showUsersButton">Mostrar Usuários Cadastrados</button>
        <div id="userListContainer"></div>

        <div id="message"></div>
    </div>

    <script>
    const dbName = 'UserBiometricsDB';
    const storeName = 'users';
    const messageDiv = document.getElementById('message');
    const registrationForm = document.getElementById('registrationForm');
    const userListContainer = document.getElementById('userListContainer');
    const showUsersButton = document.getElementById('showUsersButton');

    function openDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName, 1);

            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
            };

            request.onsuccess = (event) => {
                resolve(event.target.result);
            };

            request.onerror = (event) => {
                reject('Erro ao abrir o banco de dados.');
            };
        });
    }

    async function registerUser(name, role, company) {
        try {
            const db = await openDatabase();
            const transaction = db.transaction(storeName, 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = async (event) => {
                const users = event.target.result;
                const existingCredentials = users.map(user => ({
                    type: 'public-key',
                    id: new Uint8Array(user.credentialId)
                }));
                
                const challenge = window.crypto.getRandomValues(new Uint8Array(32));

                try {
                    const publicKey = await navigator.credentials.create({
                        publicKey: {
                            rp: { name: 'Minha Empresa' },
                            user: {
                                id: window.crypto.getRandomValues(new Uint8Array(16)),
                                name: name,
                                displayName: name
                            },
                            challenge: challenge,
                            pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
                            excludeCredentials: existingCredentials // Evita cadastros duplicados
                        }
                    });

                    const transactionWrite = db.transaction(storeName, 'readwrite');
                    const storeWrite = transactionWrite.objectStore(storeName);

                    const userData = {
                        name: name,
                        role: role,
                        company: company,
                        credentialId: Array.from(new Uint8Array(publicKey.rawId))
                    };
                    storeWrite.add(userData);

                    await transactionWrite.complete;
                    showMessage('Usuário cadastrado e digital vinculada com sucesso!', 'green');
                    registrationForm.reset();
                } catch (error) {
                    if (error.name === 'InvalidStateError') {
                        showMessage('Usuário já cadastrado com esta digital.', 'red');
                    } else {
                        showMessage(`Erro no cadastro: ${error.message}`, 'red');
                    }
                    console.error(error);
                }
            };

            request.onerror = () => {
                showMessage('Erro ao buscar usuários existentes.', 'red');
            };
            
        } catch (error) {
            showMessage(`Erro: ${error.message}`, 'red');
            console.error(error);
        }
    }

    async function authenticateUser() {
        try {
            const db = await openDatabase();
            const transaction = db.transaction(storeName, 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = async (event) => {
                const users = event.target.result;
                if (users.length === 0) {
                    showMessage('Nenhum usuário cadastrado.', 'red');
                    return;
                }
                
                const challenge = window.crypto.getRandomValues(new Uint8Array(32));

                const credentials = users.map(user => ({
                    id: new Uint8Array(user.credentialId),
                    type: 'public-key'
                }));

                const assertion = await navigator.credentials.get({
                    publicKey: {
                        allowCredentials: credentials,
                        challenge: challenge
                    }
                });

                const authenticatedUser = users.find(user =>
                    JSON.stringify(new Uint8Array(user.credentialId)) === JSON.stringify(new Uint8Array(assertion.rawId))
                );

                if (authenticatedUser) {
                    showMessage(`Olá, ${authenticatedUser.name}! Acesso confirmado.`, 'green');
                } else {
                    showMessage('Digital não reconhecida. Tente novamente.', 'red');
                }
            };

            request.onerror = () => {
                showMessage('Erro ao buscar usuários no banco.', 'red');
            };
        } catch (error) {
            showMessage(`Erro na autenticação: ${error.message}`, 'red');
            console.error(error);
        }
    }

    async function listAllUsers() {
        userListContainer.innerHTML = '';
        try {
            const db = await openDatabase();
            const transaction = db.transaction(storeName, 'readonly');
            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = (event) => {
                const users = event.target.result;
                if (users.length === 0) {
                    userListContainer.innerHTML = '<p>Nenhum usuário cadastrado.</p>';
                    return;
                }

                const ul = document.createElement('ul');
                users.forEach(user => {
                    const li = document.createElement('li');
                    li.textContent = `Nome: ${user.name}, Função: ${user.role}, Empresa: ${user.company}`;
                    ul.appendChild(li);
                });
                userListContainer.appendChild(ul);
            };

            request.onerror = () => {
                userListContainer.innerHTML = '<p>Erro ao carregar a lista de usuários.</p>';
            };

        } catch (error) {
            userListContainer.innerHTML = `<p>Erro: ${error.message}</p>`;
        }
    }

    function showMessage(text, color) {
        messageDiv.textContent = text;
        messageDiv.style.color = color;
    }

    registrationForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const role = document.getElementById('role').value;
        const company = document.getElementById('company').value;
        registerUser(name, role, company);
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        authenticateUser();
    });

    showUsersButton.addEventListener('click', listAllUsers);
</script>

</body>
</html>
